# Tema claro por defecto (criterio 21). Los colores son los tokens de `app/theme.py`:
# fijarlos aquí hace que el cromo propio de Streamlit (acentos, controles) salga ya con la
# paleta, en vez de con su azul de fábrica. El modo oscuro lo activa el interruptor de la barra
# lateral, que inyecta la variante oscura de los mismos tokens, gráficos incluidos.
[theme]
base = "light"
primaryColor = "#0F5F78"
backgroundColor = "#F2F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2733"
font = "sans serif"

# Sin el botón «Deploy» ni el menú de Streamlit Cloud. Esta aplicación se ejecuta en local
# (`run.sh` / `run.bat`): el botón llevaba a publicarla en Streamlit Community Cloud, que no es
# parte de este flujo, y el menú solo ofrecía opciones de ese servicio. «minimal» deja la barra
# superior vacía; «viewer» conservaría el menú ☰ sin el botón.
[client]
toolbarMode = "minimal"

